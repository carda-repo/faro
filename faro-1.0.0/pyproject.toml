[project]
name = "faro"
version = "1.0.0"
description = "An open-source model for identifying behavioural patterns associated with subsequent gambling self-exclusion."
authors = [{ name = "Charles de Leau" }]
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
    "scikit-learn==1.8.0",
    "xgboost==3.2.0",
    "joblib>=1.3.0,<2.0.0",
    "pandas==2.0.3",
    "numpy==1.25.1",
]

[tool.poetry]
packages = [{ include = "open_source_tool" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
